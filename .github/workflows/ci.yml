name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-c:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Compile C shared library (libcryptobench.so)
      run: |
        cd crypto_engine
        make all
        file libcryptobench.so # Verification
        
    - name: Upload compiled library
      uses: actions/upload-artifact@v4
      with:
        name: libcryptobench
        path: crypto_engine/libcryptobench.so
        retention-days: 1

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install linting dependencies
      run: pip install black flake8
      
    - name: Check code formatting (Black)
      run: black --check .
      
    - name: Run Flake8
      run: flake8 .

  test:
    needs: [build-c]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Download compiled library
      uses: actions/download-artifact@v4
      with:
        name: libcryptobench
        path: crypto_engine/
        
    - name: Run pytest with coverage
      run: pytest --cov=benchmarker --cov=dashboard tests/
      
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: .coverage
        
  integration:
    needs: [build-c, test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Download compiled library
      uses: actions/download-artifact@v4
      with:
        name: libcryptobench
        path: crypto_engine/
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Run E2E CLI test
      run: |
        # Run a tiny sweep to verify full stack: C engine -> FFI -> Python harness -> output
        python -m benchmarker.cli \
          --algo aes \
          --mode full \
          --threads 1,2 \
          --sizes 64,128 \
          --iterations 50 \
          --no-dashboard \
          --output test_results/e2e
          
        # Verify outputs created
        cat test_results/e2e.json
        wc -l test_results/e2e.csv
